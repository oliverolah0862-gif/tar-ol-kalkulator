<!DOCTYPE html>
<html>
<head>

<title>Tar-Ol Metal Kalkulátor</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body {
    font-family: Arial;
    background: #f2f2f2;
    padding: 20px;
}

.kalkulator {
    max-width: 500px;
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 20px;
}

h1 {
    text-align: center;
}

h2 {
    text-align: center;
}

label {
    font-weight: bold;
}

input, select {
    width: 100%;
    padding: 12px;
    margin-top: 5px;
    margin-bottom: 15px;
    box-sizing: border-box;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 15px;
    font-size: 18px;
    font-weight: bold;
    border: none;
    border-radius: 10px;
    background: #222;
    color: white;
}

.eredmeny {
    margin-top: 20px;
    padding: 15px;
    background: #eeeeee;
    border-radius: 10px;
}

.ar {
    font-size: 28px;
    font-weight: bold;
    text-align: center;
}

</style>

</head>

<body>

<div class="kalkulator">

<h1>🔩 TAR-OL METAL</h1>

<h2>Árkalkulátor</h2>

<details style="margin-bottom:20px;">

    <summary style="
        background:#222;
        color:white;
        padding:15px;
        border-radius:10px;
        font-size:18px;
        font-weight:bold;
        text-align:center;
        cursor:pointer;
    ">
        ⚙️ ANYAGÁRAK
    </summary>

    <div style="
        background:#f2f2f2;
        padding:15px;
        margin-top:10px;
        border-radius:10px;
    ">

        <h2>⚙️ Anyagárak</h2>

        <label>40×40 – Ft / 6 m:</label>
        <input type="number" id="ar40x40" value="7200">

        <label>60×30 – Ft / 6 m:</label>
        <input type="number" id="ar60x30" value="8770">

        <label>60×40 – Ft / 6 m:</label>
        <input type="number" id="ar60x40" value="9500">

        <label>40×30 – Ft / 6 m:</label>
        <input type="number" id="ar40x30" value="6570">

        <label>40×20 – Ft / 6 m:</label>
        <input type="number" id="ar40x20" value="5290">

        <label>30×30 – Ft / 6 m:</label>
        <input type="number" id="ar30x30" value="5380">

        <label>25×25 – Ft / 6 m:</label>
        <input type="number" id="ar25x25" value="5394">

        <button onclick="arakMentese()">
            💾 ÁRAK MENTÉSE
        </button>

    </div>

</details>

</div>

<label>Zártszelvény:</label>

<select id="profil">

<option value="40x40">40×40 – 7200 Ft / 6 m</option>

<option value="60x30">60×30 – 8770 Ft / 6 m</option>

<option value="60x40">60×40 – 9500 Ft / 6 m</option>

<option value="40x30">40×30 – 6570 Ft / 6 m</option>

<option value="40x20">40×20 – 5290 Ft / 6 m</option>

<option value="30x30">30×30 – 5380 Ft / 6 m</option>

<option value="25x25">25×25 – 5394 Ft / 6 m</option>

</select>

<label>Szükséges szálak:</label>

<input type="number" id="darab" value="1" min="1">

<hr>

<h2>🔩 Laposacél</h2>

<label>Laposacél mérete:</label>

<select id="laposmeret">

<option value="1865">20×3 – 1865 Ft / szál</option>
<option value="2375">25×3 – 2375 Ft / szál</option>
<option value="2690">30×3 – 2690 Ft / szál</option>
<option value="3650">40×3 – 3650 Ft / szál</option>
<option value="4670">50×3 – 4670 Ft / szál</option>
<option value="6100">60×3 – 6100 Ft / szál</option>

</select>

<label>Laposacél szálak száma:</label>

<input type="number" id="laposdarab" value="1" min="1">

<div id="felulet"
     style="margin-top:10px;
            margin-bottom:15px;
            padding:12px;
            background:#eeeeee;
            border-radius:10px;
            font-weight:bold;
            text-align:center;">
    🎨 Festendő felület: 0,96 m²
</div>

<label>Festék kiadóssága (m²/l):</label>

<input
    type="number"
    id="kiadossag"
    value="8"
    min="0.1"
    step="0.1"
    >
    
    <div id="festekMennyiseg"
     style="margin-top:10px;
            margin-bottom:15px;
            padding:12px;
            background:#eeeeee;
            border-radius:10px;
            font-weight:bold;
            text-align:center;">
    🧴 Szükséges festék: 0 liter
</div>

<label>Munkadíj (Ft):</label>

<input type="number" id="munka" value="0">


<label>Festés (Ft):</label>

<input type="number" id="festes" value="0">


<label>Egyéb költség (Ft):</label>

<input type="number" id="egyeb" value="0">


<label>Haszonkulcs (%):</label>

<input type="number" id="haszon" value="30">


<button onclick="szamol()">

ÁR KISZÁMÍTÁSA

</button>


<div class="eredmeny">

<p>Anyagköltség:</p>

<p id="anyag">0 Ft</p>

<p>Önköltség:</p>

<p id="koltseg">0 Ft</p>

<p>Haszon:</p>

<p id="haszonAr">0 Ft</p>

<p>Végső eladási ár:</p>

<p class="ar" id="vegso">0 Ft</p>

</div>

</div>


<script>

let anyagarak = {
    "40x40": 7200,
    "60x30": 8770,
    "60x40": 9500,
    "40x30": 6570,
    "40x20": 5290,
    "30x30": 5380,
    "25x25": 5394
};


// ====================
// ANYAGÁRAK BETÖLTÉSE
// ====================

let mentettArak = localStorage.getItem("tarOlAnyagarak");

if (mentettArak) {
    anyagarak = JSON.parse(mentettArak);
}


// ====================
// ANYAGÁRAK MEGJELENÍTÉSE
// ====================

function arakFrissitese() {

    document.getElementById("ar40x40").value = anyagarak["40x40"];
    document.getElementById("ar60x30").value = anyagarak["60x30"];
    document.getElementById("ar60x40").value = anyagarak["60x40"];
    document.getElementById("ar40x30").value = anyagarak["40x30"];
    document.getElementById("ar40x20").value = anyagarak["40x20"];
    document.getElementById("ar30x30").value = anyagarak["30x30"];
    document.getElementById("ar25x25").value = anyagarak["25x25"];

}


// ====================
// ÁRAK MENTÉSE
// ====================

function arakMentese() {

    anyagarak["40x40"] = Number(document.getElementById("ar40x40").value);
    anyagarak["60x30"] = Number(document.getElementById("ar60x30").value);
    anyagarak["60x40"] = Number(document.getElementById("ar60x40").value);
    anyagarak["40x30"] = Number(document.getElementById("ar40x30").value);
    anyagarak["40x20"] = Number(document.getElementById("ar40x20").value);
    anyagarak["30x30"] = Number(document.getElementById("ar30x30").value);
    anyagarak["25x25"] = Number(document.getElementById("ar25x25").value);

    localStorage.setItem(
        "tarOlAnyagarak",
        JSON.stringify(anyagarak)
    );

    alert("✅ Anyagárak elmentve!");

}


// ====================
// KALKULÁTOR
// ====================

function szamol() {

    let profil = document.getElementById("profil").value;

    let ar = anyagarak[profil];

    let darab = Number(
        document.getElementById("darab").value
    );
let laposAr = Number(
    document.getElementById("laposmeret").value
);

let laposDarab = Number(
    document.getElementById("laposdarab").value
);
    let meretek = {
    "40x40": [0.04, 0.04],
    "60x30": [0.06, 0.03],
    "60x40": [0.06, 0.04],
    "40x30": [0.04, 0.03],
    "40x20": [0.04, 0.02],
    "30x30": [0.03, 0.03],
    "25x25": [0.025, 0.025]
};

let szelesseg = meretek[profil][0];
let magassag = meretek[profil][1];

let felulet = 2 * (szelesseg + magassag) * 6 * darab;

document.getElementById("felulet").innerHTML =
    "🎨 Festendő felület: " + felulet.toFixed(2) + " m²";

    let kiadossag = Number(
    document.getElementById("kiadossag").value
);

let szuksegesFestek = felulet / kiadossag;

document.getElementById("festekMennyiseg").innerHTML =
    "🧴 Szükséges festék: " + szuksegesFestek.toFixed(2) + " liter";    
    let munka = Number(
        document.getElementById("munka").value
    );

    let festes = Number(
        document.getElementById("festes").value
    );

    let egyeb = Number(
        document.getElementById("egyeb").value
    );

    let haszon = Number(
        document.getElementById("haszon").value
    );


    let anyagkoltseg =
    (ar * darab) +
    (laposAr * laposDarab) +
    (szogAr * szogDarab);

    let koltseg =
        anyagkoltseg +
        munka +
        festes +
        egyeb;

    let haszonAr =
        koltseg * haszon / 100;

    let vegso =
        koltseg + haszonAr;


    document.getElementById("anyag").innerHTML =
        anyagkoltseg.toFixed(0) + " Ft";

    document.getElementById("koltseg").innerHTML =
        koltseg.toFixed(0) + " Ft";

    document.getElementById("haszonAr").innerHTML =
        haszonAr.toFixed(0) + " Ft";

    document.getElementById("vegso").innerHTML =
        vegso.toFixed(0) + " Ft";

}


// ====================
// INDULÁSKOR
// ====================

arakFrissitese();

function profilArakFrissitese() {

    document.querySelector('#profil option[value="40x40"]').textContent =
        "40×40 – " + anyagarak["40x40"] + " Ft / 6 m";

    document.querySelector('#profil option[value="60x30"]').textContent =
        "60×30 – " + anyagarak["60x30"] + " Ft / 6 m";

    document.querySelector('#profil option[value="60x40"]').textContent =
        "60×40 – " + anyagarak["60x40"] + " Ft / 6 m";

    document.querySelector('#profil option[value="40x30"]').textContent =
        "40×30 – " + anyagarak["40x30"] + " Ft / 6 m";

    document.querySelector('#profil option[value="40x20"]').textContent =
        "40×20 – " + anyagarak["40x20"] + " Ft / 6 m";

    document.querySelector('#profil option[value="30x30"]').textContent =
        "30×30 – " + anyagarak["30x30"] + " Ft / 6 m";

    document.querySelector('#profil option[value="25x25"]').textContent =
        "25×25 – " + anyagarak["25x25"] + " Ft / 6 m";
}

profilArakFrissitese();

</script>

</body>

</html>
